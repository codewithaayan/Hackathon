services:
  - type: web
    name: urbanpulse-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://aetherioncityintel.netlify.app","http://localhost:3000"]'
      - key: ALLOWED_HOSTS
        value: '["scenic-simultaneously-tower-genome.trycloudflare.com","localhost","127.0.0.1"]'
      - key: TEAM_COMPONENTS_FACTORY
        value: ''
      - key: PORT
        value: '8000'
